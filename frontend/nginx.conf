# Configuração do nginx para servir a SPA (build Vite/React).
# Objetivo: corrigir o 404 ao recarregar/deep-link em rotas client-side
# (ex.: /app/dashboard), servindo sempre o index.html como fallback para o
# react-router assumir a rota no cliente.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão de texto para reduzir payload (JS/CSS/HTML/JSON/SVG).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Assets versionados com hash no nome (ex.: /assets/app-ab12cd34.js).
    # Como o hash muda a cada build, podem ser cacheados por muito tempo.
    # Ainda assim usamos try_files para servir o arquivo físico real;
    # se não existir, cai no fallback (não deveria ocorrer para asset válido).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fallback SPA: tenta o arquivo físico ($uri), depois diretório ($uri/),
    # e por fim entrega o index.html. Isso garante 200 + index.html em
    # qualquer rota do react-router (reload/deep-link), preservando o
    # caminho/query/hash — o navegador reenvia a URL original, e o
    # react-router resolve a rota no cliente.
    # Assets físicos reais (favicon, imagens, manifest, etc.) são servidos
    # diretamente pelo $uri antes de chegar ao index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html referencia o bundle com hash atual; não pode ser cacheado
    # de forma agressiva, senão um reload pode servir HTML velho apontando
    # para um bundle que não existe mais.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
