# APENAS PARA TESTE LOCAL: banco H2 em memória (apagado ao parar) e usuário adm / 123.
# Rode com: mvn spring-boot:run -Dspring-boot.run.profiles=local -Dspring-boot.run.useTestClasspath=true
APP_PORT: 6060
DB_HOST: unused
DB_PORT: 0
DB_NAME: unused
DB_USERNAME: sa
DB_PASSWORD: local_test_only
JWT_SECRET: local_test_only_jwt_secret_not_for_production_use_000
JWT_ACCESS_TOKEN_MINUTES: 120
JWT_REFRESH_TOKEN_DAYS: 7
DEVICE_KEY_ENCRYPTION_SECRET: local_test_only_device_key_secret_0000
INITIAL_ADMIN_NAME: Administrador
INITIAL_ADMIN_USERNAME: admin
INITIAL_ADMIN_PASSWORD: local_test_only_admin
CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174

spring:
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:ete-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
