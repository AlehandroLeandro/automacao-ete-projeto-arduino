server:
  port: ${APP_PORT}

spring:
  application:
    name: ete-backend
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  shift-day-start: ${SHIFT_DAY_START:05:00}
  shift-night-start: ${SHIFT_NIGHT_START:17:00}
  operator:
    record-window-hours: ${OPERATOR_RECORD_WINDOW_HOURS:24}
  device:
    encryption-secret: ${DEVICE_KEY_ENCRYPTION_SECRET:}
    offline-minutes: ${DEVICE_OFFLINE_MINUTES:5}
    rate-limit-per-minute: ${DEVICE_RATE_LIMIT_PER_MINUTE:10}
  push:
    vapid:
      public-key: ${PUSH_VAPID_PUBLIC_KEY:}
      private-key: ${PUSH_VAPID_PRIVATE_KEY:}
      subject: ${PUSH_VAPID_SUBJECT:mailto:admin@example.com}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS}

initial-admin:
  name: ${INITIAL_ADMIN_NAME}
  username: ${INITIAL_ADMIN_USERNAME}
  password: ${INITIAL_ADMIN_PASSWORD}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://192.168.7.32:5174}

stations:
  empresa-1-name: ${STATION_EMPRESA_1_NAME:Empresa 1}
  empresa-2-name: ${STATION_EMPRESA_2_NAME:Empresa 2}
