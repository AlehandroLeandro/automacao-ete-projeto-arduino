services:
  database:
    image: postgres:16-alpine
    container_name: ete-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?Set DB_USERNAME in .env} -d ${DB_NAME:?Set DB_NAME in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ete-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      APP_PORT: ${APP_PORT:?Set APP_PORT in .env}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:?Set JWT_ACCESS_TOKEN_MINUTES in .env}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:?Set JWT_REFRESH_TOKEN_DAYS in .env}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:?Set INITIAL_ADMIN_NAME in .env}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?Set INITIAL_ADMIN_USERNAME in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      SHIFT_DAY_START: ${SHIFT_DAY_START:-05:00}
      SHIFT_NIGHT_START: ${SHIFT_NIGHT_START:-17:00}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174,http://192.168.7.32:5174}
      NOTIFICATION_SHIFT_REMINDER_MINUTES: ${NOTIFICATION_SHIFT_REMINDER_MINUTES:-10}
      NOTIFICATION_MEASUREMENT_INTERVAL_MINUTES: ${NOTIFICATION_MEASUREMENT_INTERVAL_MINUTES:-60}
      PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-false}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-mailto:admin@example.com}
    ports:
      - "${APP_PORT:?Set APP_PORT in .env}:${APP_PORT:?Set APP_PORT in .env}"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
        VITE_APP_NAME: ${VITE_APP_NAME:-Sistema de Gestao ETE}
        VITE_DEFAULT_STATION_MODE: ${VITE_DEFAULT_STATION_MODE:-consolidated}
    container_name: ete-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  postgres-data:
